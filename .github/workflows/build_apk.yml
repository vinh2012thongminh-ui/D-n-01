name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "748585705351",
              "project_id": "duthi-giaitudonghoa",
              "storage_bucket": "duthi-giaitudonghoa.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:748585705351:android:9403602f16f9caa0777d22",
                  "android_client_info": {
                    "package_name": "com.vinhho.onthi10ai"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "748585705351-erd094oevqmd89am5svogi5o7ireisoq.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.vinhho.onthi10ai",
                      "certificate_hash": "515e3fe6259ade6e42bc2fb5be017bbf17929a56"
                    }
                  },
                  {
                    "client_id": "748585705351-agdru1r6r8nhpni2h079ip2o0lnsjjbt.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyD0rwIzCpA73DzXxnqYB3eV19Xv5GkvWfw"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "748585705351-agdru1r6r8nhpni2h079ip2o0lnsjjbt.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaSuAI-12Cap-APK
          path: app/build/outputs/apk/debug/app-debug.apk
